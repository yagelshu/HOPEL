name: chopel_app
description: Tactical combat medical app for military reserve medics.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  supabase_flutter: ^2.16.0
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  uuid: ^4.5.3
  flutter_riverpod: ^3.3.2
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.0
  path: ^1.9.1
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.14+2
  syncfusion_flutter_pdfviewer: ^34.1.30
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  sqflite_common_ffi: ^2.4.2+1

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#111827"
    theme_color: "#4ADE80"
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#0F1712"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/

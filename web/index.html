  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    window.hopalBiometrics = {
      isAvailable: async function () {
        try {
          if (!window.PublicKeyCredential || !navigator.credentials) return false;
          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        } catch (e) {
          return false;
        }
      },
      register: async function (userId, userName) {
        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const userBytes = new TextEncoder().encode(userId || 'hopal-user');
          const credential = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: 'HOPAL - חופ"ל', id: window.location.hostname },
              user: {
                id: userBytes,
                name: userName || 'חופ"ל',
                displayName: userName || 'חופ"ל'
              },
              pubKeyCredParams: [
                { type: 'public-key', alg: -7 },
                { type: 'public-key', alg: -257 }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required',
                residentKey: 'preferred'
              },
              timeout: 60000
            }
          });
          if (!credential || !credential.rawId) return null;
          const bytes = new Uint8Array(credential.rawId);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        } catch (e) {
          console.error('WebAuthn register failed:', e);
          return null;
        }
      },
      authenticate: async function (credentialIdBase64Url) {
        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const publicKey = {
            challenge: challenge,
            rpId: window.location.hostname,
            userVerification: 'required',
            timeout: 60000
          };
          if (credentialIdBase64Url && credentialIdBase64Url.length > 0) {
            let base64 = credentialIdBase64Url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            const binary = atob(base64);
            const idBytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
              idBytes[i] = binary.charCodeAt(i);
            }
            publicKey.allowCredentials = [
              { type: 'public-key', id: idBytes }
            ];
          }
          const assertion = await navigator.credentials.get({ publicKey: publicKey });
          return !!assertion;
        } catch (e) {
          console.error('WebAuthn authenticate failed:', e);
          return false;
        }
      }
    };
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      try {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(async function (v) {
            if (!v || !v.build_number) return;
            var remoteBuild = String(v.build_number);
            var localBuild = localStorage.getItem('hopal_active_build');
            var reloadedFor = sessionStorage.getItem('hopal_reloaded_build');
            if (localBuild !== remoteBuild && reloadedFor !== remoteBuild) {
              localStorage.setItem('hopal_active_build', remoteBuild);
              sessionStorage.setItem('hopal_reloaded_build', remoteBuild);
              var hadSw = false;
              try {
                if ('serviceWorker' in navigator) {
                  var regs = await navigator.serviceWorker.getRegistrations();
                  if (regs.length > 0) hadSw = true;
                  for (var i = 0; i < regs.length; i++) { await regs[i].unregister(); }
                }
                if ('caches' in window) {
                  var keys = await caches.keys();
                  for (var j = 0; j < keys.length; j++) { await caches.delete(keys[j]); }
                }
                await Promise.allSettled([
                  fetch(window.location.pathname, { cache: 'reload' }),
                  fetch('flutter_bootstrap.js?v=' + remoteBuild, { cache: 'reload' }),
                  fetch('main.dart.js', { cache: 'reload' }),
                  fetch('main.dart.js?v=' + remoteBuild, { cache: 'reload' })
                ]);
              } catch (_) {}
              if (localBuild !== null || hadSw) {
                var u = new URL(window.location.href);
                u.searchParams.set('v', remoteBuild);
                window.location.replace(u.toString());
              }
            } else {
              localStorage.setItem('hopal_active_build', remoteBuild);
            }
          })
          .catch(function () {});
      } catch (_) {}
    })();
  </script>
